<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行天宮線上求籤 AI 版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f5f5f0; }
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        @keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-6px) rotate(-2deg); } 75% { transform: translateX(6px) rotate(2deg); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(0.99); } }
        .animate-shake { animation: shake 0.1s infinite; }
        .animate-wiggle { animation: wiggle 2s infinite; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Download, Check, RotateCcw, HandCoins, ArrowRight } from 'lucide-react';

        // --- 1. 資料區 (原本在 constants.ts 的資料) ---
        const POEM_DATA = [
            { title: "第一籤", grade: "大吉", poem: "巍巍獨步向雲間\n玉殿千官第一班\n富貴榮華天付汝\n福如東海壽如山", advice: "功名大吉，財源廣進。", explanation: "這代表你的願望將會達成，獲得極大的福報。" }
        ];

        // --- 2. 組件區 (原本在組件資料夾的內容) ---
        const BweiVisual = ({ result, isAnimating }) => (
            <div className={`flex justify-center gap-4 text-6xl my-10 ${isAnimating ? 'animate-bounce' : ''}`}>
                {result === 'sheng' ? (
                    <React.Fragment><span className="rotate-45">🌙</span><span className="-rotate-45 scale-x-[-1]">🌙</span></React.Fragment>
                ) : result === 'xiao' ? (
                    <React.Fragment><span className="rotate-45 scale-x-[-1]">🌙</span><span className="-rotate-45">🌙</span></React.Fragment>
                ) : (
                    <span className="text-4xl text-stone-400 italic">點擊開始擲筊</span>
                )}
            </div>
        );

        // --- 3. 主程式區 ---
        const App = () => {
            const [step, setStep] = useState('welcome');
            const [currentPoem, setCurrentPoem] = useState(null);
            const [bweiResult, setBweiResult] = useState(null);
            const [isBweiAnimating, setIsBweiAnimating] = useState(false);
            const [shengCount, setShengCount] = useState(0);
            const [isShaking, setIsShaking] = useState(false);

            const handleDraw = () => {
                setIsShaking(true);
                setTimeout(() => {
                    setIsShaking(false);
                    setCurrentPoem(POEM_DATA[Math.floor(Math.random() * POEM_DATA.length)]);
                    setStep('draw_result');
                    setTimeout(() => setStep('bwei'), 2000);
                }, 1500);
            };

            const handleCastBwei = () => {
                if (isBweiAnimating) return;
                setIsBweiAnimating(true);
                setTimeout(() => {
                    const res = Math.random() > 0.4 ? 'sheng' : 'xiao';
                    setBweiResult(res);
                    setIsBweiAnimating(false);
                    if (res === 'sheng') {
                        const newCount = shengCount + 1;
                        if (newCount === 3) {
                            setStep('result');
                        } else {
                            setShengCount(newCount);
                        }
                    } else {
                        setShengCount(0); // 沒擲到聖筊就重來
                    }
                }, 800);
            };

            return (
                <div className="min-h-screen flex flex-col items-center">
                    <header className="w-full bg-red-900 text-white py-6 text-center shadow-lg sticky top-0 z-50">
                        <h1 className="text-2xl font-bold font-serif-tc tracking-widest">行天宮線上求籤</h1>
                    </header>
                    
                    <main className="w-full max-w-2xl p-6 mt-4">
                        <div className="bg-white rounded-3xl shadow-2xl min-h-[50vh] flex flex-col items-center justify-center p-10 border border-stone-200">
                            
                            {step === 'welcome' && (
                                <div className="text-center space-y-8 animate-in fade-in">
                                    <div className="w-32 h-32 bg-red-100 rounded-full flex items-center justify-center mx-auto">
                                        <span className="text-5xl">🙏</span>
                                    </div>
                                    <h2 className="text-4xl font-black text-red-900 font-serif-tc">恩主公靈籤</h2>
                                    <p className="text-stone-500">誠心向 恩主公稟告您的姓名與所求之事</p>
                                    <button onClick={() => setStep('drawing')} className="w-full bg-red-800 text-white px-8 py-4 rounded-2xl text-xl font-bold hover:bg-red-900 transition-all flex items-center justify-center gap-3">
                                        開始求籤 <ArrowRight />
                                    </button>
                                </div>
                            )}

                            {step === 'drawing' && (
                                <div className="text-center space-y-10">
                                    <h3 className="text-2xl font-serif-tc font-bold">請點擊按鈕抽取靈籤</h3>
                                    <div className={`text-8xl ${isShaking ? 'animate-shake' : 'animate-wiggle'}`}>🏺</div>
                                    <button onClick={handleDraw} disabled={isShaking} className="bg-red-800 text-white px-10 py-4 rounded-full text-lg">
                                        {isShaking ? '正在抽籤...' : '搖動籤筒'}
                                    </button>
                                </div>
                            )}

                            {step === 'draw_result' && (
                                <div className="text-center space-y-6">
                                    <p className="text-stone-400">抽中靈籤</p>
                                    <h3 className="text-7xl font-black text-red-900 font-serif-tc">{currentPoem?.title}</h3>
                                    <p className="animate-pulse text-red-800">準備擲筊確認...</p>
                                </div>
                            )}

                            {step === 'bwei' && (
                                <div className="text-center w-full space-y-4">
                                    <h3 className="text-xl font-bold">擲筊確認 ({shengCount}/3 聖筊)</h3>
                                    <div onClick={handleCastBwei} className="cursor-pointer active:scale-90 transition-transform">
                                        <BweiVisual result={bweiResult} isAnimating={isBweiAnimating} />
                                    </div>
                                    <div className="flex justify-center gap-4">
                                        {[1, 2, 3].map(i => (
                                            <div key={i} className={`w-10 h-10 rounded-full border-2 flex items-center justify-center ${shengCount >= i ? 'bg-green-500 border-green-200 text-white' : 'bg-stone-50 text-stone-300'}`}>
                                                {shengCount >= i ? <Check size={20} /> : i}
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-stone-400 text-sm">點擊筊杯請示 恩主公</p>
                                </div>
                            )}

                            {step === 'result' && (
                                <div className="text-center space-y-6 font-serif-tc animate-in zoom-in">
                                    <h3 className="text-3xl font-bold text-red-900 underline underline-offset-8 decoration-red-200">{currentPoem?.title}</h3>
                                    <div className="text-2xl whitespace-pre-wrap leading-loose font-black text-stone-800 bg-stone-50 p-6 rounded-2xl border border-stone-100">
                                        {currentPoem?.poem}
                                    </div>
                                    <div className="text-left space-y-4">
                                        <p><strong className="text-red-800">【聖意】</strong><br/>{currentPoem?.advice}</p>
                                        <p><strong className="text-red-800">【解說】</strong><br/>{currentPoem?.explanation}</p>
                                    </div>
                                    <button onClick={() => {setStep('welcome'); setShengCount(0); setBweiResult(null);}} className="w-full py-4 text-red-800 font-bold flex items-center justify-center gap-2 hover:bg-red-50 rounded-xl transition-colors">
                                        <RotateCcw size={20} /> 再求一籤
                                    </button>
                                </div>
                            )}

                        </div>
                    </main>
                    <footer className="py-10 text-stone-400 text-sm">© 2025 行天宮線上求籤 · AI 整合版</footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
